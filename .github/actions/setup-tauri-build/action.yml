name: 'Setup Tauri Build Environment'
description: 'Setup Node.js, Bun, Rust, and dependencies for Tauri build'

inputs:
  bun-version:
    description: 'Bun version to use'
    required: false
    default: '1.2.0'
  rust-target:
    description: 'Rust target architecture'
    required: false
    default: 'x86_64-unknown-linux-gnu'
  enable-sccache:
    description: 'Enable sccache for Rust compilation'
    required: false
    default: 'true'

runs:
  using: "composite"
  steps:
    - name: Setup Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Cache Bun dependencies
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
        restore-keys: ${{ runner.os }}-bun-

    - name: Install frontend dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Cache Rust/sccache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          ~/.cache/sccache
        key: ${{ runner.os }}-rust-sccache-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-rust-sccache-

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        target: ${{ inputs.rust-target }}

    - name: Setup sccache
      if: ${{ inputs.enable-sccache == 'true' }}
      uses: mozilla-actions/sccache-action@v0.0.9
      with:
        disable_annotations: true

    - name: Install Tauri CLI
      shell: bash
      run: |
        if ! command -v cargo-tauri &> /dev/null; then
          cargo install tauri-cli --version '^2.0.0' --locked
        fi

    - name: Install Linux dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
