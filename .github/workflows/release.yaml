name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v0.0.1)'
        required: false
        default: 'v0.0.1'
        type: string
      platform:
        description: 'Target platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - windows
          - macos
          - linux
          - ios

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Ensure GitHub Release exists (lightweight initialization)
  # -------------------------------------------------------------
  init-release:
    name: Ensure Release Exists
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag_step.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Tag
        id: tag_step
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ -n "${GITHUB_REF_NAME}" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v0.0.1"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Create or Ensure GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_step.outputs.tag }}
          name: "Haipee ${{ steps.tag_step.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # -------------------------------------------------------------
  # Job 2: Android Build (Runs in parallel with other platforms)
  # -------------------------------------------------------------
  build-android:
    name: Build Android
    needs: [init-release]
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'android') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ -n "${GITHUB_REF_NAME}" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v0.0.1"
          fi
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Disable Swift Package Manager in Flutter
        run: flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get

      - name: Optional DanDan API injection
        run: |
          if [ -n "${{ secrets.DANDANAPI_APPID }}" ] && [ -n "${{ secrets.DANDANAPI_KEY }}" ]; then
            sed -i "s/kvpx7qkqjh/${{ secrets.DANDANAPI_APPID }}/g" lib/utils/api_credentials.dart
            sed -i "s/rABUaBLqdz7aCSi3fe88ZDj2gwga9Vax/${{ secrets.DANDANAPI_KEY }}/g" lib/utils/api_credentials.dart
          fi

      - name: Build Flutter Android APK
        run: flutter build apk --release --split-per-abi

      - name: Package Android Artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/haipee-android-arm64-${{ env.RELEASE_TAG }}.apk || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/haipee-android-armv7-${{ env.RELEASE_TAG }}.apk || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/haipee-android-x86_64-${{ env.RELEASE_TAG }}.apk || true

      - name: Upload Android Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------
  # Job 3: Windows Build (Runs in parallel with other platforms)
  # -------------------------------------------------------------
  build-windows:
    name: Build Windows
    needs: [init-release]
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows') }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Git longpaths
        run: git config --system core.longpaths true

      - name: Resolve Tag
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          if (-not $tag) {
            $tag = "${{ github.ref_name }}"
          }
          if (-not $tag -or $tag -eq "main") {
            $tag = "v0.0.1"
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Disable Swift Package Manager in Flutter
        run: flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get

      - name: Optional DanDan API injection
        env:
          DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
          DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}
        shell: pwsh
        run: |
          if ($env:DANDANAPI_APPID -and $env:DANDANAPI_KEY) {
            (Get-Content -Path 'lib/utils/api_credentials.dart') -replace "kvpx7qkqjh", "$env:DANDANAPI_APPID" | Set-Content -Path 'lib/utils/api_credentials.dart'
            (Get-Content -Path 'lib/utils/api_credentials.dart') -replace "rABUaBLqdz7aCSi3fe88ZDj2gwga9Vax", "$env:DANDANAPI_KEY" | Set-Content -Path 'lib/utils/api_credentials.dart'
          }

      - name: Build Flutter Windows
        run: flutter build windows --release

      - name: Package Windows Portable Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\haipee-windows-${{ env.RELEASE_TAG }}.zip" -Force

      - name: Upload Windows Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------
  # Job 4: macOS Build (Runs in parallel with other platforms)
  # -------------------------------------------------------------
  build-macos:
    name: Build macOS
    needs: [init-release]
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos') }}
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ -n "${GITHUB_REF_NAME}" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v0.0.1"
          fi
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Disable Swift Package Manager in Flutter
        run: flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get

      - name: Optional DanDan API injection
        run: |
          if [ -n "${{ secrets.DANDANAPI_APPID }}" ] && [ -n "${{ secrets.DANDANAPI_KEY }}" ]; then
            sed -i '' "s/kvpx7qkqjh/${{ secrets.DANDANAPI_APPID }}/g" lib/utils/api_credentials.dart
            sed -i '' "s/rABUaBLqdz7aCSi3fe88ZDj2gwga9Vax/${{ secrets.DANDANAPI_KEY }}/g" lib/utils/api_credentials.dart
          fi

      - name: Build Flutter macOS
        run: flutter build macos --release

      - name: Package macOS Universal Zip
        run: |
          mkdir -p dist
          (cd build/macos/Build/Products/Release && zip -q -r "$GITHUB_WORKSPACE/dist/haipee-macos-universal-${{ env.RELEASE_TAG }}.zip" *.app)

      - name: Upload macOS Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------
  # Job 5: Linux Build (Runs in parallel with other platforms)
  # -------------------------------------------------------------
  build-linux:
    name: Build Linux
    needs: [init-release]
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Tag and Version
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ -n "${GITHUB_REF_NAME}" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v0.0.1"
          fi
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          VERSION="${TAG#v}"
          echo "RELEASE_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev unzip libasound2-dev libmpv-dev libwebkit2gtk-4.1-dev libkeybinder-3.0-dev libcurl4-openssl-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Disable Swift Package Manager in Flutter
        run: flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get

      - name: Optional DanDan API injection
        run: |
          if [ -n "${{ secrets.DANDANAPI_APPID }}" ] && [ -n "${{ secrets.DANDANAPI_KEY }}" ]; then
            sed -i "s/kvpx7qkqjh/${{ secrets.DANDANAPI_APPID }}/g" lib/utils/api_credentials.dart
            sed -i "s/rABUaBLqdz7aCSi3fe88ZDj2gwga9Vax/${{ secrets.DANDANAPI_KEY }}/g" lib/utils/api_credentials.dart
          fi

      - name: Build Flutter Linux
        run: flutter build linux --release

      - name: Package Linux Artifacts (tar.gz & deb)
        shell: bash
        run: |
          mkdir -p dist

          # 1. Tarball package
          tar -zcvf dist/haipee-linux-${{ env.RELEASE_TAG }}-amd64.tar.gz -C build/linux/x64/release/bundle .

          # 2. Debian package (.deb)
          mkdir -p haipee_deb/opt/Haipee
          mkdir -p haipee_deb/usr/share/applications
          mkdir -p haipee_deb/usr/share/icons/hicolor/512x512/apps
          cp -r build/linux/x64/release/bundle/* haipee_deb/opt/Haipee/
          cp -r assets/linux/DEBIAN haipee_deb/
          chmod 0755 haipee_deb/DEBIAN/postinst haipee_deb/DEBIAN/postrm

          {
            echo "Package: haipee"
            echo "Version: ${RELEASE_VERSION}"
            echo "Section: video"
            echo "Priority: optional"
            echo "Architecture: amd64"
            echo "Maintainer: hugetiny <https://github.com/hugetiny>"
            echo "Installed-Size: 35000"
            echo "Description: Haipee - The modern media and streaming hub"
            echo "Homepage: https://haipee.com"
            echo "Depends: libayatana-appindicator3-1, gir1.2-ayatanaappindicator3-0.1, libwebkit2gtk-4.1-0"
          } > haipee_deb/DEBIAN/control

          cp assets/linux/io.github.hugetiny.haipee.desktop haipee_deb/usr/share/applications/
          cp assets/images/logo/logo_linux.png haipee_deb/usr/share/icons/hicolor/512x512/apps/io.github.hugetiny.haipee.png

          dpkg-deb --build --root-owner-group haipee_deb dist/haipee-linux-${{ env.RELEASE_TAG }}-amd64.deb

      - name: Upload Linux Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/*.tar.gz
            dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------
  # Job 6: iOS Build (Runs in parallel with other platforms)
  # -------------------------------------------------------------
  build-ios:
    name: Build iOS
    needs: [init-release]
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'ios') }}
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ -n "${GITHUB_REF_NAME}" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v0.0.1"
          fi
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Disable Swift Package Manager in Flutter
        run: flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get

      - name: Optional DanDan API injection
        run: |
          if [ -n "${{ secrets.DANDANAPI_APPID }}" ] && [ -n "${{ secrets.DANDANAPI_KEY }}" ]; then
            sed -i '' "s/kvpx7qkqjh/${{ secrets.DANDANAPI_APPID }}/g" lib/utils/api_credentials.dart
            sed -i '' "s/rABUaBLqdz7aCSi3fe88ZDj2gwga9Vax/${{ secrets.DANDANAPI_KEY }}/g" lib/utils/api_credentials.dart
          fi

      - name: Build Flutter iOS (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned IPA
        run: |
          mkdir -p dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -q -r dist/haipee-ios-unsigned-${{ env.RELEASE_TAG }}.ipa Payload
          rm -rf Payload

      - name: Upload iOS Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
