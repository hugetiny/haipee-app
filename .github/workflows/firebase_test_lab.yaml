name: Firebase Test Lab Automated AI Testing

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test Lab execution mode (instrumentation, robo, or both)'
        required: false
        type: choice
        options:
          - 'both'
          - 'instrumentation'
          - 'robo'
        default: 'both'
      test_timeout:
        description: 'Test timeout per matrix (e.g. 3m, 5m)'
        required: false
        default: '5m'
      device_tier:
        description: 'Device Tier to test against'
        required: false
        type: choice
        options:
          - 'Flagship (Pixel 7 / Android 33)'
          - 'Multi-device Matrix (Pixel 7 Android 33 + Pixel 6 Android 32)'
        default: 'Flagship (Pixel 7 / Android 33)'
      run_ios:
        description: 'Attempt iOS build & validation (requires macOS runner)'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/firebase_test_lab.yaml'

jobs:
  build-and-test:
    name: Cloud Build & Firebase Test Lab Robo Run
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Free Runner Disk Space
        run: |
          echo "=== Freeing Disk Space on GitHub Runner ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          echo "=== Disk Space After Cleanup ==="
          df -h
        shell: bash

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android Instrumentation & Release APKs
        run: |
          TEST_MODE="${{ github.event.inputs.test_mode }}"
          TEST_MODE="${TEST_MODE:-both}"
          if [[ "$TEST_MODE" == "instrumentation" || "$TEST_MODE" == "both" ]]; then
            echo "Building Android Instrumentation Test APKs (integration_test/app_crawler_test.dart)..."
            pushd android
            chmod +x ./gradlew
            ./gradlew app:assembleAndroidTest
            ./gradlew app:assembleDebug -Ptarget="$(pwd)/../integration_test/app_crawler_test.dart" -Pdart-defines="RklSRUJBU0VfVEVTVF9MQUI9dHJ1ZQ=="
            popd
          fi
          if [[ "$TEST_MODE" == "robo" || "$TEST_MODE" == "both" ]]; then
            echo "Building arm64 Release APK with Sentry Telemetry..."
            flutter build apk --release \
              --target-platform android-arm64 \
              --android-skip-build-dependency-validation \
              --dart-define=SENTRY_DSN="${{ secrets.SENTRY_DSN }}" \
              --dart-define=FIREBASE_TEST_LAB=true
          fi
        shell: bash

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: haipee-release-testlab-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7

      - name: Check Google Cloud Credentials
        id: check_creds
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "::warning::GCP_SA_KEY secret is not configured. Skipping Firebase Test Lab execution."
            echo "### ⚠️ Firebase Test Lab Not Executed" >> $GITHUB_STEP_SUMMARY
            echo "The Android APK was compiled successfully with Sentry telemetry enabled." >> $GITHUB_STEP_SUMMARY
            echo "To enable automated cloud Robo testing on real devices, add **GCP_SA_KEY** to GitHub Secrets." >> $GITHUB_STEP_SUMMARY
          else
            echo "has_creds=true" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Authenticate to Google Cloud
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Firebase Test Lab Dual-Mode Suite (Instrumentation + Robo)
        if: steps.check_creds.outputs.has_creds == 'true'
        id: run_testlab
        run: |
          TEST_MODE="${{ github.event.inputs.test_mode }}"
          TEST_MODE="${TEST_MODE:-both}"
          TIMEOUT="${{ github.event.inputs.test_timeout }}"
          TIMEOUT="${TIMEOUT:-5m}"
          DEVICE_TIER="${{ github.event.inputs.device_tier }}"
          DEVICE_TIER="${DEVICE_TIER:-Flagship (Pixel 7 / Android 33)}"
          PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}"
          PROJECT_ID="${PROJECT_ID:-flutter-e3137}"
          
          DEVICE_ARGS="--device model=panther,version=33,locale=zh_CN,orientation=portrait"
          if [[ "$DEVICE_TIER" == *"Multi-device"* ]]; then
            DEVICE_ARGS="$DEVICE_ARGS --device model=oriole,version=32,locale=zh_CN,orientation=portrait"
          fi

          TEST_EXIT_CODE=0

          if [[ "$TEST_MODE" == "instrumentation" || "$TEST_MODE" == "both" ]]; then
            DEBUG_APK=$(find build/app/outputs/apk/debug -name "*.apk" | head -n 1)
            TEST_APK=$(find build/app/outputs/apk/androidTest/debug -name "*.apk" | head -n 1)
            echo "Launching Firebase Test Lab Instrumentation Patrol ($DEBUG_APK + $TEST_APK)..."
            gcloud firebase test android run \
              --type instrumentation \
              --app "$DEBUG_APK" \
              --test "$TEST_APK" \
              --project "$PROJECT_ID" \
              $DEVICE_ARGS \
              --timeout "$TIMEOUT" \
              --client-details matrixLabel="Haipee CI Instrumentation Bug Hunter" \
              --no-record-video 2>&1 | tee test_lab_inst_output.log
            INST_EXIT=${PIPESTATUS[0]}
            if [ "$INST_EXIT" -ne 0 ]; then
              TEST_EXIT_CODE=$INST_EXIT
            fi
          fi

          if [[ "$TEST_MODE" == "robo" || "$TEST_MODE" == "both" ]]; then
            APK_FILE=$(ls build/app/outputs/flutter-apk/*release*.apk | head -n 1)
            echo "Target Release APK: $APK_FILE"

            ROBO_SCRIPT_ARG=""
            if [ -f "tool/testlab_roboscript.json" ]; then
              ROBO_SCRIPT_ARG="--robo-script tool/testlab_roboscript.json"
            fi

            echo "Launching Firebase Test Lab Robo crawl on project: $PROJECT_ID..."
            gcloud firebase test android run \
              --type robo \
              --app "$APK_FILE" \
              --project "$PROJECT_ID" \
              $DEVICE_ARGS \
              $ROBO_SCRIPT_ARG \
              --timeout "$TIMEOUT" \
              --client-details matrixLabel="Haipee GitHub Actions CI" \
              --no-record-video 2>&1 | tee test_lab_output.log
            ROBO_EXIT=${PIPESTATUS[0]}
            if [ "$ROBO_EXIT" -ne 0 ]; then
              TEST_EXIT_CODE=$ROBO_EXIT
            fi
          fi

          echo "Test Lab completed with overall exit code: $TEST_EXIT_CODE"

          # Extract Firebase Test Lab results URL from logs
          RESULTS_URL=$(grep -oE 'https://console.firebase.google.com/project/[^ ]*' test_lab_output.log | head -n 1 || true)
          echo "results_url=$RESULTS_URL" >> $GITHUB_OUTPUT
          
          # Extract GCS bucket path and download raw artifacts
          GCS_PATH=$(grep -oE 'gs://[a-zA-Z0-9_\.\-]+/[^ ]*' test_lab_output.log | head -n 1 || true)
          if [ -n "$GCS_PATH" ]; then
            mkdir -p test_reports/firebase_android
            echo "Downloading artifacts from $GCS_PATH..."
            gcloud storage cp -r "$GCS_PATH/*" test_reports/firebase_android/ || true
            find test_reports/firebase_android -mindepth 2 -type f -exec cp -n {} test_reports/firebase_android/ \; 2>/dev/null || true
          fi

          echo "### 🚀 Firebase Test Lab Robo Test Completed" >> $GITHUB_STEP_SUMMARY
          if [ -n "$RESULTS_URL" ]; then
            echo "[View Test Lab Cloud Report, Screen Recording & UI Tree]($RESULTS_URL)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Exploration Duration**: $TIMEOUT" >> $GITHUB_STEP_SUMMARY
          echo "- **Telemetry**: Sentry Flutter capture active (tagged with \`runner=firebase_test_lab\`)" >> $GITHUB_STEP_SUMMARY

          # Execute local deterministic Test Lab log analysis and append to Step Summary
          if [ -f "tool/analyze_testlab_logs.dart" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📊 Firebase Test Lab 确定性日志深度分析报告" >> $GITHUB_STEP_SUMMARY
            dart tool/analyze_testlab_logs.dart --markdown >> $GITHUB_STEP_SUMMARY || true
          fi

          exit $TEST_EXIT_CODE
        shell: bash

      - name: Upload Test Lab Logs and Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-lab-logs-and-reports
          path: |
            test_lab_output.log
            test_reports/
          if-no-files-found: ignore

  ios-build-and-test:
    name: Cloud Build & iOS Test Lab Validation
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_ios == true
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build iOS App Bundle (Unsigned Release)
        run: |
          echo "Building iOS Release..."
          flutter build ios --release --no-codesign --dart-define=FIREBASE_TEST_LAB=true
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -q -r haipee-release-unsigned.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: haipee-release-unsigned-ipa
          path: haipee-release-unsigned.ipa

      - name: Check Apple Code Signing & Test Lab Readiness
        run: |
          echo "### 📱 iOS Firebase Test Lab Status" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact**: haipee-release-unsigned.ipa compiled successfully." >> $GITHUB_STEP_SUMMARY
          echo "- **Physical Device Requirement**: Firebase Test Lab tests iOS apps on real physical devices (e.g. iPhone 14 Pro, iOS 16.6). Apple's kernel enforces signature verification; unsigned IPAs are rejected during matrix creation." >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment Note**: To run cloud Robo crawls on real iPhones, provide an Apple Developer Team profile / enterprise provisioning certificate in GitHub Secrets." >> $GITHUB_STEP_SUMMARY


