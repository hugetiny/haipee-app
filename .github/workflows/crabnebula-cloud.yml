# CrabNebula Cloud Build & Release Workflow
# Builds and signs Haipee for all platforms using CrabNebula Cloud
# https://docs.crabnebula.dev/cloud/ci/github-actions

name: CrabNebula Cloud Build

on:
  push:
    branches:
      - main
      - haipee
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v3.12.0)'
        required: false
        default: ''

env:
  CRABNEBULA_API_KEY: ${{ secrets.CRABNEBULA_API_KEY }}
  # Bun version
  BUN_VERSION: '1.2.0'

jobs:
  # Build and release using CrabNebula Cloud
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: |
            aarch64-apple-darwin
            x86_64-apple-darwin
            aarch64-unknown-linux-gnu
            x86_64-unknown-linux-gnu
            x86_64-pc-windows-msvc

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2.0.0' --locked

      - name: Install CrabNebula Cloud CLI
        run: |
          curl -fsSL https://cdn.crabnebula.app/install/cncloud-cli.sh | sh
          echo "$HOME/.cncloud/bin" >> $GITHUB_PATH

      - name: Verify CrabNebula CLI
        run: cncloud --version

      - name: Build frontend
        run: bun run build:renderer

      # Build for macOS (Universal Binary)
      - name: Build macOS (arm64)
        if: false  # Disabled - using CrabNebula Cloud instead
        run: |
          cd src-tauri
          cargo tauri build --target aarch64-apple-darwin

      # Use CrabNebula Cloud for building and signing
      - name: Build with CrabNebula Cloud
        run: |
          cncloud build \
            --project haipee \
            --api-key ${{ secrets.CRABNEBULA_API_KEY }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: haipee-builds
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe

  # Create release with signed builds
  release:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: haipee-builds
          path: releases

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: releases/**
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true

  # Update latest.json for auto-updater
  update-updater:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: haipee-builds
          path: releases

      - name: Generate latest.json
        run: |
          VERSION=${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}
          VERSION=${VERSION#v}

          # Note: CrabNebula Cloud signs the binaries, but signatures need to be extracted
          # For now, empty signatures will work with GitHub releases
          # CrabNebula Cloud endpoint provides signatures automatically

          cat > latest.json << EOF
          {
            "version": "v$VERSION",
            "notes": "See the assets to download this version and install.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/v$VERSION/Haipee_aarch64.app.tar.gz"
              },
              "darwin-x86_64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/v$VERSION/Haipee_x64.app.tar.gz"
              },
              "linux-x86_64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/v$VERSION/haipee_${VERSION}_amd64.AppImage"
              },
              "windows-x86_64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/v$VERSION/Haipee_${VERSION}_x64-setup.exe"
              }
            }
          }
          EOF

          cat latest.json

      - name: Upload latest.json to release
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json

  # CrabNebula Cloud Publish (optional - publish to CrabNebula App Store)
  publish-to-crabnebula:
    needs: build-and-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CrabNebula Cloud CLI
        run: |
          curl -fsSL https://cdn.crabnebula.app/install/cncloud-cli.sh | sh
          echo "$HOME/.cncloud/bin" >> $GITHUB_PATH

      - name: Publish to CrabNebula Cloud
        run: |
          cncloud publish \
            --project haipee \
            --api-key ${{ secrets.CRABNEBULA_API_KEY }} \
            --tag ${GITHUB_REF_NAME}
