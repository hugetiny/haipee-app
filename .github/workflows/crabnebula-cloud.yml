# CrabNebula Cloud Build & Release Workflow
# Builds and signs Haipee for all platforms using CrabNebula Cloud
# https://docs.crabnebula.dev/cloud/ci/github-actions

name: CrabNebula Cloud Build

on:
  push:
    branches:
      - main
      - haipee
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v3.12.0)'
        required: false
        default: ''

env:
  CRABNEBULA_API_KEY: ${{ secrets.CRABNEBULA_API_KEY }}
  BUN_VERSION: '1.2.0'
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTFLAGS: "-D warnings"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Cache Bun dependencies
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Cache Rust toolchain and cargo
      - name: Cache Rust toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Install Rust
        run: |
          if ! command -v rustc &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu x86_64-pc-windows-msvc || true
          rustc --version

      # Cache and install Tauri CLI
      - name: Cache Tauri CLI
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: ${{ runner.os }}-tauri-cli-v2

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version '^2.0.0' --locked

      # Cache CrabNebula CLI
      - name: Cache CrabNebula CLI
        id: cache-cncloud
        uses: actions/cache@v4
        with:
          path: ~/.cncloud/bin/cncloud
          key: ${{ runner.os }}-cncloud-cli

      - name: Install CrabNebula Cloud CLI
        if: steps.cache-cncloud.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://cdn.crabnebula.app/install/cncloud-cli.sh | sh

      - name: Setup CLI paths
        run: |
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "$HOME/.cncloud/bin" >> $GITHUB_PATH

      - name: Verify CLIs
        run: |
          cargo tauri --version
          cncloud --version

      - name: Build frontend
        run: bun run build:renderer

      - name: Build with CrabNebula Cloud
        run: |
          cncloud build \
            --project haipee \
            --api-key ${{ secrets.CRABNEBULA_API_KEY }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: haipee-builds
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
          retention-days: 7

  release:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: haipee-builds
          path: releases

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: releases/**
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true

  update-updater:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: haipee-builds
          path: releases

      - name: Generate latest.json
        run: |
          VERSION=${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}
          VERSION=${VERSION#v}
          cat > latest.json << EOF
          {
            "version": "v$VERSION",
            "notes": "See the assets to download this version and install.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/v$VERSION/Haipee_aarch64.app.tar.gz"
              },
              "darwin-x86_64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/v$VERSION/Haipee_x64.app.tar.gz"
              },
              "linux-x86_64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/v$VERSION/haipee_${VERSION}_amd64.AppImage"
              },
              "windows-x86_64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/v$VERSION/Haipee_${VERSION}_x64-setup.exe"
              }
            }
          }
          EOF
          cat latest.json

      - name: Upload latest.json to release
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json

  publish-to-crabnebula:
    needs: build-and-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore CrabNebula CLI cache
        uses: actions/cache@v4
        with:
          path: ~/.cncloud/bin/cncloud
          key: ${{ runner.os }}-cncloud-cli

      - name: Install CrabNebula CLI
        run: |
          if [ ! -f ~/.cncloud/bin/cncloud ]; then
            curl -fsSL https://cdn.crabnebula.app/install/cncloud-cli.sh | sh
          fi
          echo "$HOME/.cncloud/bin" >> $GITHUB_PATH

      - name: Publish to CrabNebula Cloud
        run: |
          cncloud publish \
            --project haipee \
            --api-key ${{ secrets.CRABNEBULA_API_KEY }} \
            --tag ${GITHUB_REF_NAME}
