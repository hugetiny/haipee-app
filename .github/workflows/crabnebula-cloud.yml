# CrabNebula Cloud Build & Release Workflow
# Builds and signs Haipee for all platforms using CrabNebula Cloud
# https://docs.crabnebula.dev/cloud/ci/github-actions

name: CrabNebula Cloud Build

on:
  push:
    branches:
      - main
      - haipee
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v3.12.0)'
        required: false
        default: ''

# Cancel in-flight runs for the same branch/tag
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.2.0'
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

jobs:
  # Optional: fast typecheck before triggering expensive cloud build
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  build-and-release:
    needs: typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # CrabNebula Cloud builds in their cloud — only the CLI is needed here
      - name: Cache CrabNebula CLI
        id: cache-cncloud
        uses: actions/cache@v4
        with:
          path: ~/.cncloud/bin/cncloud
          key: ${{ runner.os }}-cncloud-cli

      - name: Install CrabNebula Cloud CLI
        if: steps.cache-cncloud.outputs.cache-hit != 'true'
        run: curl -fsSL https://cdn.crabnebula.app/install/cncloud-cli.sh | sh

      - name: Setup CLI path
        run: |
          ls -la ~/.cncloud/bin/ || echo "Directory not found"
          echo "$HOME/.cncloud/bin" >> $GITHUB_PATH

      - name: Build with CrabNebula Cloud
        env:
          CRABNEBULA_API_KEY: ${{ secrets.CRABNEBULA_API_KEY }}
        # tauri.conf.json has beforeBuildCommand set, so no need to pre-build renderer
        run: |
          export PATH="$HOME/.cncloud/bin:$PATH"
          which cncloud || (echo "cncloud not found, installing..." && curl -fsSL https://cdn.crabnebula.app/install/cncloud-cli.sh | sh)
          cncloud build \
            --project haipee \
            --api-key $CRABNEBULA_API_KEY

  release:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    steps:
      # CrabNebula Cloud builds on their infrastructure.
      # Download artifacts via their CLI instead of expecting them on the runner.
      - name: Cache CrabNebula CLI
        id: cache-cncloud
        uses: actions/cache@v4
        with:
          path: ~/.cncloud/bin/cncloud
          key: ${{ runner.os }}-cncloud-cli

      - name: Install CrabNebula Cloud CLI
        if: steps.cache-cncloud.outputs.cache-hit != 'true'
        run: curl -fsSL https://cdn.crabnebula.app/install/cncloud-cli.sh | sh

      - name: Setup CLI path
        run: echo "$HOME/.cncloud/bin" >> $GITHUB_PATH

      - name: Download build artifacts from CrabNebula Cloud
        env:
          CRABNEBULA_API_KEY: ${{ secrets.CRABNEBULA_API_KEY }}
        run: |
          export PATH="$HOME/.cncloud/bin:$PATH"
          mkdir -p releases
          cncloud download \
            --project haipee \
            --api-key $CRABNEBULA_API_KEY \
            --output releases

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: releases/**
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true

  update-updater:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate latest.json with signatures
        run: |
          TAG=${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}
          VERSION=${TAG#v}
          RELEASE_BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          # Extract minisign signatures from the .sig files in the release
          # (Tauri bundler produces .sig alongside each artifact)
          fetch_sig() {
            local url="$1"
            curl -fsSL "${url}.sig" 2>/dev/null || echo ""
          }

          DARWIN_AARCH64_URL="${RELEASE_BASE}/Haipee_${VERSION}_aarch64.app.tar.gz"
          DARWIN_X64_URL="${RELEASE_BASE}/Haipee_${VERSION}_x64.app.tar.gz"
          LINUX_X64_URL="${RELEASE_BASE}/haipee_${VERSION}_amd64.AppImage"
          WINDOWS_X64_URL="${RELEASE_BASE}/Haipee_${VERSION}_x64-setup.nsis.zip"

          cat > latest.json << EOF
          {
            "version": "${TAG}",
            "notes": "See the assets to download this version and install.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "$(fetch_sig "$DARWIN_AARCH64_URL")",
                "url": "${DARWIN_AARCH64_URL}"
              },
              "darwin-x86_64": {
                "signature": "$(fetch_sig "$DARWIN_X64_URL")",
                "url": "${DARWIN_X64_URL}"
              },
              "linux-x86_64": {
                "signature": "$(fetch_sig "$LINUX_X64_URL")",
                "url": "${LINUX_X64_URL}"
              },
              "windows-x86_64": {
                "signature": "$(fetch_sig "$WINDOWS_X64_URL")",
                "url": "${WINDOWS_X64_URL}"
              }
            }
          }
          EOF
          cat latest.json

      - name: Upload latest.json to release
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json

  publish-to-crabnebula:
    needs: build-and-release
    runs-on: ubuntu-latest
    # Publish on tag push OR manual dispatch with a tag specified
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache CrabNebula CLI
        id: cache-cncloud
        uses: actions/cache@v4
        with:
          path: ~/.cncloud/bin/cncloud
          key: ${{ runner.os }}-cncloud-cli

      - name: Install CrabNebula CLI
        if: steps.cache-cncloud.outputs.cache-hit != 'true'
        run: curl -fsSL https://cdn.crabnebula.app/install/cncloud-cli.sh | sh

      - name: Setup CLI path
        run: echo "$HOME/.cncloud/bin" >> $GITHUB_PATH

      - name: Publish to CrabNebula Cloud
        env:
          CRABNEBULA_API_KEY: ${{ secrets.CRABNEBULA_API_KEY }}
        run: |
          export PATH="$HOME/.cncloud/bin:$PATH"
          TAG=${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}
          cncloud publish \
            --project haipee \
            --api-key $CRABNEBULA_API_KEY \
            --tag ${TAG}
