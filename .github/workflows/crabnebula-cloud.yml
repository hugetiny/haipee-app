# CrabNebula Cloud Build & Release Workflow
# Builds Haipee for Linux and publishes to GitHub Releases and CrabNebula Cloud
# https://docs.crabnebula.dev/cloud/ci/github-actions

name: CrabNebula Cloud Build

on:
  push:
    branches:
      - main
      - haipee
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v3.12.0)'
        required: false
        default: ''

# Cancel in-flight runs for the same branch/tag
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.2.0'
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: 'true'
  RUSTC_WRAPPER: 'sccache'
  CN_APPLICATION: haipee/haipee
  # Force Node.js 24 for all actions to fix deprecation warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  # Create draft release on CrabNebula Cloud (only on tags)
  draft:
    needs: typecheck
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      - name: Create draft release
        uses: crabnebula-dev/cloud-release@v0.2.0
        with:
          command: release draft ${{ env.CN_APPLICATION }} ${{ steps.version.outputs.VERSION }}
          api-key: ${{ secrets.CRABNEBULA_API_KEY }}

  # Build Linux only (saves credits vs macOS/Windows runners)
  build-linux:
    needs: draft
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Cache Rust/sccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cache/sccache
          key: ${{ runner.os }}-rust-sccache-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-rust-sccache-

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-unknown-linux-gnu

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          disable_annotations: true

      - name: Install Tauri CLI
        run: |
          if ! command -v cargo-tauri &> /dev/null; then
            cargo install tauri-cli --version '^2.0.0' --locked
          fi

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build Tauri App (Linux)
        run: |
          cd src-tauri
          cargo tauri build --target x86_64-unknown-linux-gnu

      - name: Find bundle files
        id: bundle
        run: |
          BUNDLE_DIR="src-tauri/target/x86_64-unknown-linux-gnu/release/bundle"
          APPIMAGE=$(ls $BUNDLE_DIR/appimage/*.AppImage 2>/dev/null | head -1)
          DEB=$(ls $BUNDLE_DIR/deb/*.deb 2>/dev/null | head -1)
          RPM=$(ls $BUNDLE_DIR/rpm/*.rpm 2>/dev/null | head -1)
          echo "appimage=$APPIMAGE" >> $GITHUB_OUTPUT
          echo "deb=$DEB" >> $GITHUB_OUTPUT
          echo "rpm=$RPM" >> $GITHUB_OUTPUT
          echo "Found:"
          echo "  AppImage: $APPIMAGE"
          echo "  DEB: $DEB"
          echo "  RPM: $RPM"
        shell: bash

      - name: Upload AppImage to CrabNebula Cloud
        uses: crabnebula-dev/cloud-release@v0.2.0
        with:
          command: release upload --file "${{ steps.bundle.outputs.appimage }}" ${{ env.CN_APPLICATION }} ${{ needs.draft.outputs.version }}
          api-key: ${{ secrets.CRABNEBULA_API_KEY }}

      - name: Upload DEB to CrabNebula Cloud
        uses: crabnebula-dev/cloud-release@v0.2.0
        with:
          command: release upload --file "${{ steps.bundle.outputs.deb }}" ${{ env.CN_APPLICATION }} ${{ needs.draft.outputs.version }}
          api-key: ${{ secrets.CRABNEBULA_API_KEY }}

      - name: Upload RPM to CrabNebula Cloud
        uses: crabnebula-dev/cloud-release@v0.2.0
        with:
          command: release upload --file "${{ steps.bundle.outputs.rpm }}" ${{ env.CN_APPLICATION }} ${{ needs.draft.outputs.version }}
          api-key: ${{ secrets.CRABNEBULA_API_KEY }}

      - name: Upload artifacts for GitHub Release
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
          retention-days: 7

  # Publish release on GitHub
  release:
    needs: build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: releases

      - name: Create Release
        uses: softprops/action-gh-release@v2.6.1
        with:
          files: releases/**
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true

  # Generate and upload latest.json for auto-updater
  update-updater:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: releases

      - name: Generate latest.json
        run: |
          TAG=${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}
          VERSION=${TAG#v}
          RELEASE_BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          # Find actual artifact names
          APP_IMAGE=$(ls releases/*.AppImage 2>/dev/null | head -1 | xargs basename 2>/dev/null || echo "haipee_${VERSION}_amd64.AppImage")

          cat > latest.json << EOF
          {
            "version": "${TAG}",
            "notes": "See the assets to download this version and install.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "linux-x86_64": {
                "signature": "",
                "url": "${RELEASE_BASE}/${APP_IMAGE}"
              }
            }
          }
          EOF
          cat latest.json

      - name: Upload latest.json to release
        uses: softprops/action-gh-release@v2.6.1
        with:
          files: latest.json

  # Publish to CrabNebula Cloud
  publish:
    needs: [build-linux, draft]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        uses: crabnebula-dev/cloud-release@v0.2.0
        with:
          command: release publish ${{ env.CN_APPLICATION }} ${{ needs.draft.outputs.version }}
          api-key: ${{ secrets.CRABNEBULA_API_KEY }}
