# CrabNebula Cloud Build & Release Workflow
# Builds and signs Haipee using CrabNebula Cloud
# https://docs.crabnebula.dev/cloud/ci/github-actions

name: CrabNebula Cloud Build

on:
  push:
    branches:
      - main
      - haipee
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v3.12.0)'
        required: false
        default: ''

# Cancel in-flight runs for the same branch/tag
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.2.0'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  # CrabNebula Cloud build - handles all platforms in parallel
  build:
    needs: typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Build using CrabNebula Cloud (builds all platforms in parallel)
      - name: Build with CrabNebula Cloud
        uses: crabnebula-dev/cloud-release@v0.2.0
        with:
          command: build --project haipee
          api-key: ${{ secrets.CRABNEBULA_API_KEY }}

  # Create GitHub Release with artifacts from CrabNebula Cloud
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts from CrabNebula Cloud
        uses: crabnebula-dev/cloud-release@v0.2.0
        with:
          command: download --project haipee --latest --output releases
          api-key: ${{ secrets.CRABNEBULA_API_KEY }}

      - name: List downloaded artifacts
        run: ls -la releases/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: releases/**
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true

  # Generate and upload latest.json for auto-updater
  update-updater:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts from CrabNebula Cloud
        uses: crabnebula-dev/cloud-release@v0.2.0
        with:
          command: download --project haipee --latest --output releases
          api-key: ${{ secrets.CRABNEBULA_API_KEY }}

      - name: Generate latest.json with signatures
        run: |
          TAG=${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}
          VERSION=${TAG#v}
          RELEASE_BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          # Helper to fetch signature from .sig files
          fetch_sig() {
            local file="$1"
            if [ -f "releases/${file}.sig" ]; then
              cat "releases/${file}.sig"
            else
              echo ""
            fi
          }

          # Find actual artifact names
          APP_IMAGE=$(ls releases/*.AppImage 2>/dev/null | head -1 | xargs basename 2>/dev/null || echo "haipee_${VERSION}_amd64.AppImage")

          cat > latest.json << EOF
          {
            "version": "${TAG}",
            "notes": "See the assets to download this version and install.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "linux-x86_64": {
                "signature": "",
                "url": "${RELEASE_BASE}/${APP_IMAGE}"
              }
            }
          }
          EOF
          cat latest.json

      - name: Upload latest.json to release
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json

  # Publish to CrabNebula Cloud (makes update available via CDN)
  publish-to-crabnebula:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish to CrabNebula Cloud
        uses: crabnebula-dev/cloud-release@v0.2.0
        with:
          command: release draft haipee ${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}]
          api-key: ${{ secrets.CRABNEBULA_API_KEY }}
