name: CrabNebula E2E Tests

on:
  push:
    branches: [main, haipee]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: Install dependencies
        run: bun install

      - name: Build Tauri app
        run: bun run test:e2e:crabnebula:build

      - name: Run E2E tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" bun run test:e2e:crabnebula
        env:
          CN_SKIP_MACOS_CHECK: "true"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            wdio-logs/
            ai-loop-logs/
          retention-days: 7