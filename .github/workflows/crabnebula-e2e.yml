# CrabNebula E2E Tests
# https://docs.crabnebula.dev/plugins/tauri-e2e-tests/
name: CrabNebula E2E Tests

on:
  push:
    branches: [main, haipee]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.2.0'
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: 'true'
  RUSTC_WRAPPER: 'sccache'

jobs:
  e2e-tests:
    # Must use x86_64 - CrabNebula tauri-driver doesn't support ARM Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Tauri Build Environment
        uses: ./.github/actions/setup-tauri-build
        with:
          bun-version: ${{ env.BUN_VERSION }}
          rust-target: x86_64-unknown-linux-gnu
          enable-sccache: 'true'

      - name: Install E2E test dependencies
        run: |
          sudo apt-get install -y webkit2gtk-driver libayatana-appindicator3-dev

      - name: Build Tauri app for E2E tests
        run: bun run test:e2e:build

      - name: Run E2E tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" bun run test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            wdio-logs/
            ai-loop-logs/
          retention-days: 7