name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Flutter Analyze & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev libasound2-dev libmpv-dev libwebkit2gtk-4.1-dev libkeybinder-3.0-dev libcurl4-openssl-dev

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter Analyze (0 errors, 0 warnings gate)
        run: flutter analyze

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Cache libgopeed native library
        id: cache-libgopeed
        uses: actions/cache@v4
        with:
          path: linux/libgopeed.so
          key: libgopeed-linux-${{ hashFiles('tool/build_gopeed.sh') }}

      - name: Build libgopeed native library for Linux
        if: steps.cache-libgopeed.outputs.cache-hit != 'true'
        run: |
          if [ ! -f "linux/libgopeed.so" ]; then
            if [ ! -d "third_party/gopeed" ]; then
              git clone --depth 1 https://github.com/GopeedLab/gopeed.git third_party/gopeed
            fi
            chmod +x tool/build_gopeed.sh
            ./tool/build_gopeed.sh linux
          fi

      - name: Run Flutter Tests (100% pass gate)
        run: flutter test
